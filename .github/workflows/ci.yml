name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: hq_admin
          POSTGRES_PASSWORD: ci-throwaway-admin
          POSTGRES_DB: halal_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hq_admin -d halal_quant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway passwords for the CI-only database; it is destroyed after every run.
      HQ_DB_HOST: 127.0.0.1
      HQ_DB_PORT: 5432
      HQ_DB_NAME: halal_quant
      HQ_DB_ADMIN_USER: hq_admin
      HQ_DB_ADMIN_PASSWORD: ci-throwaway-admin
      HQ_DB_MIGRATOR_PASSWORD: ci-throwaway-migrator
      HQ_DB_APP_PASSWORD: ci-throwaway-app
      HQ_DB_READONLY_PASSWORD: ci-throwaway-readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks needs full history to scan a PR's commit range

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Security lint (bandit)
        run: uv run bandit -r src

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Database bootstrap (roles + schema)
        run: uv run python -m halal_quant.db.bootstrap

      - name: Migrations check (upgrade, downgrade, upgrade, drift check on a fresh database)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check   # the code's table definitions match the migrations

      - name: Tests (pytest, with coverage, including database tests)
        env:
          HQ_RUN_INTEGRATION_TESTS: "1"
        run: uv run pytest
