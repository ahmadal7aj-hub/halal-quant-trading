[project]
name = "halal-quant"
version = "0.1.0"
description = "Halal quantitative trading research platform (V1) - research only, paper trading"
readme = "README.md"
authors = [
    { name = "Ahmad Alhaj" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
halal-quant = "halal_quant:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "--cov=halal_quant --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/halal_quant"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
