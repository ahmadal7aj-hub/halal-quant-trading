# Eligible-universe filters (PRD section 8), applied after the Sharia screen.
# Values approved by the owner on 2026-09-30 (open issue OI-11). Changing ANY value needs owner
# approval and a new version (e.g. universe-v2 in a new file): old results keep their version.
config_type: universe
version: universe-v1
status: approved
approved_by: owner
approved_on: 2026-09-30
sharia_methodology: AAOIFI-v1

min_price_usd: "5.00"  # avoid penny stocks
min_median_daily_dollar_volume_usd: "1000000"
liquidity_window_trading_days: 20
max_price_age_trading_days: 5  # an older last price is stale, so the stock is excluded
